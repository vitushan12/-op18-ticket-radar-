name: Update OP-18 ticket radar
on:
  push:
    branches: [main]
    paths-ignore: ['data/status.json']
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: op18-radar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python scripts/test_monitor.py
      - run: python scripts/monitor.py
      - name: Send ticket push alerts
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/send_push.py
      - name: Save updated status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/status.json
          if [ -f data/push-state.json ]; then git add data/push-state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh OP-18 radar status'
            if ! git push; then
              echo "::warning::Another edit landed while the scanner was running. Retrying safely."
              git fetch origin main
              if git rebase origin/main; then
                if ! git push; then
                  echo "::warning::Status commit could not be pushed after retry; website deployment will still proceed."
                fi
              else
                git rebase --abort
                echo "::warning::Status conflicts with another update; preserving the newer remote version. Website deployment will still proceed."
              fi
            fi
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: |
          mkdir _site
          cp index.html app.js styles.css sw.js manifest.webmanifest .nojekyll untouchables-op18-2026-11-11.ics _site/
          cp -r icons data push _site/
          cp notifications.html notifications.js _site/
          python -c 'import json,os; open("_site/push-config.json","w").write(json.dumps({"appId":os.environ.get("ONESIGNAL_APP_ID", "")}))'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
