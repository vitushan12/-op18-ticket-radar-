name: Update OP-18 ticket radar
on:
  push:
    branches: [main]
    paths-ignore: ['data/status.json']
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: op18-radar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python scripts/test_monitor.py
      - run: python scripts/monitor.py
      - name: Save updated status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh OP-18 radar status'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html app.js styles.css sw.js manifest.webmanifest .nojekyll _site/
          cp -r icons data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
