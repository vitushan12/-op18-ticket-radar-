<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17182d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Robin Watch">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <link rel="stylesheet" href="./styles.css">
  <title>Robin Price Drop — Watch List</title>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Robin Price Drop home"><span class="brand-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m5 5 14 14M8 19h11V8"/></svg></span><span><span class="brand-overline">WATCH LIST</span><strong>Robin Price Drop</strong></span></a>
