<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1426">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OP18 Radar">
  <meta name="description" content="Track GTA One Piece OP-18 release event ticket listings, event dates and store status.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>OP-18 Ticket Radar</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brandmark" aria-hidden="true">✦</div><div><span class="eyebrow">GRAND LINE // GTA</span><strong>OP-18 <span class="gold">RADAR</span></strong></div></div>
      <button class="iconbtn" id="refreshBtn" title="Load latest published check" aria-label="Refresh published data">↻</button>
    </header>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <p style="padding:0 20px"><a href="./notifications.html">🔔 Enable notifications / Manage alerts</a></p>
    <main id="app" tabindex="-1"></main>
    <nav class="bottomnav" aria-label="App navigation">
      <button data-tab="dashboard" class="navitem active"><span class="nav-icon">◫</span><span>Home</span></button>
      <button data-tab="events" class="navitem"><span class="nav-icon">▦</span><span>Events</span></button>
      <button data-tab="stores" class="navitem"><span class="nav-icon">⌂</span><span>Shops</span></button>
      <button data-tab="activity" class="navitem"><span class="nav-icon">◷</span><span>Checks</span></button>
      <button data-tab="settings" class="navitem"><span class="nav-icon">⚙</span><span>More</span></button>
    </nav>
  </div>
  <dialog id="storeDialog"><form id="storeForm" method="dialog"><h2>Add a card shop</h2><p class="muted small">A shop added here is saved on this device. Automatic checking requires adding its URL to the hosted monitor.</p><label>Store name<input id="addName" required maxlength="70" placeholder="Card shop name"></label><label>Area<select id="addCity"><option>Scarborough</option><option>Toronto</option><option>Vaughan</option><option>North York</option><option>Markham</option><option>Richmond Hill</option><option>Other GTA</option></select></label><label>Event website<input id="addUrl" type="url" placeholder="https://..."></label><div class="modalbuttons"><button type="button" id="cancelDialog" class="secondary">Cancel</button><button type="submit" class="primary">Save shop</button></div></form></dialog>
  <script src="./data/seed.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
